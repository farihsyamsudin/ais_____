version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    ports:
      - "27015:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./backend
    ports:
      - "5020:5000"   # host 5020 → container 5000
    environment:
      MONGODB_URI: mongodb://mongodb:27017/
      DATABASE_NAME: ais_transhipment_db
      COLLECTION_NAME: ais_signals
      FLASK_ENV: development
      PORT: 5000
    depends_on:
      - mongodb

  frontend:
    image: nginx:alpine
    ports:
      - "8013:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend

volumes:
  mongodb_data: