version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    ports:
      - "27015:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5020:5000"   # host 5020 → container 5000
    command: gunicorn -w 1 --threads 4 -b 0.0.0.0:5000 app:app
    environment:
      MONGODB_URI: mongodb://mongodb:27017/
      DATABASE_NAME: ais_transhipment_db
      COLLECTION_NAME: ais_signals
      FLASK_ENV: development
      PORT: 5000
    depends_on:
      - mongodb

  ews_monitor:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python /app/ews/ews_monitor.py
    environment:
      MONGODB_URI: mongodb://mongodb:27017/
      DATABASE_NAME: ais_transhipment_db
      # Add email configuration for alerts. You can also use env_file: backend/.env
    env_file:
      - backend/.env
    depends_on:
      - mongodb

  frontend:
    image: nginx:alpine
    ports:
      - "8013:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend

volumes:
  mongodb_data: